{% extends "base.html" %}
{% block title %}Classes{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold mb-0"><i class="bi bi-diagram-3 me-2"></i>School Classes</h3>
  <a href="{% url 'students:class_add' %}" class="btn btn-primary btn-lg"><i class="bi bi-plus-lg me-1"></i>Add Class</a>
</div>
<div class="card" style="max-width:480px;">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>Class Name</th><th>Display Order</th></tr></thead>
      <tbody>
        {% for c in classes %}
        <tr><td class="fw-semibold fs-5">{{ c.name }}</td><td>{{ c.order }}</td></tr>
        {% empty %}
        <tr><td colspan="2" class="text-center text-muted py-4">No classes yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
