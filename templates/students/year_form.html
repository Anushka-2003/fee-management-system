{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4 gap-3">
  <a href="{% url 'students:year_list' %}" class="btn btn-outline-secondary btn-lg"><i class="bi bi-arrow-left"></i></a>
  <h3 class="fw-bold mb-0">{{ title }}</h3>
</div>
<div class="card" style="max-width:480px;">
  <div class="card-body p-4">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
      </div>
      {% endfor %}
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary btn-lg">Save</button>
        <a href="{% url 'students:year_list' %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
